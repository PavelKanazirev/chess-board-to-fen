name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fonts with chess glyphs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev,train]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest
      - name: Dataset script smoke test
        run: python scripts/generate_dataset.py --boards 8 --val-boards 4 --out-dir /tmp/smoke
      - name: Training script smoke test
        run: python scripts/train.py --epochs 1 --train /tmp/smoke/train.npz --val /tmp/smoke/val.npz --out /tmp/smoke/model.keras
      - name: Evaluation script smoke test
        run: python scripts/evaluate_model.py --test-boards 5 --scenes 3 --out-dir /tmp/evaluation
      - name: Prediction script smoke test
        run: python scripts/predict.py --render 3000000
